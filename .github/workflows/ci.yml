name: CI/CD - Server

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Syntax → Test → Audit
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for MongoDB service
        run: |
          for attempt in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/27017) 2>/dev/null && exit 0
            sleep 1
          done
          echo "MongoDB service did not become ready." >&2
          exit 1

      # Syntax check all source files — catches import errors, typos, broken ES modules
      - name: Syntax check (node --check)
        run: |
          find src tests scripts -name "*.js" | xargs node --check
          echo "All source files passed syntax check"

      # Unit + integration tests. With the MongoDB service and TEST_* variables set,
      # the guarded database suites execute instead of skipping.
      - name: Run tests
        run: npm test -- --experimental-test-coverage --test-concurrency=1
        env:
          NODE_ENV: test
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/legalease_ci
          TEST_MONGODB_DB_NAME: legalease_ci_test
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-minimum-32-characters-long' }}
          CLIENT_ORIGINS: 'http://localhost:5173'

      - name: Dependency audit
        run: npm audit --audit-level=high

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
          NODE_ENV: production
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_ONBOARDING_SECRET: ${{ secrets.GOOGLE_ONBOARDING_SECRET }}
          CLIENT_ORIGINS: ${{ secrets.CLIENT_ORIGINS }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_CURRENCY: ${{ secrets.STRIPE_CURRENCY }}
          LAWYER_PUBLISHING_FEE_CENTS: ${{ secrets.LAWYER_PUBLISHING_FEE_CENTS }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SSCOMMERZ_STORE_ID: ${{ secrets.SSCOMMERZ_STORE_ID }}
          SSCOMMERZ_STORE_PASSWORD: ${{ secrets.SSCOMMERZ_STORE_PASSWORD }}
          SSCOMMERZ_SANDBOX: ${{ secrets.SSCOMMERZ_SANDBOX }}
          VONAGE_API_KEY: ${{ secrets.VONAGE_API_KEY }}
          VONAGE_API_SECRET: ${{ secrets.VONAGE_API_SECRET }}
          VONAGE_FROM_NUMBER: ${{ secrets.VONAGE_FROM_NUMBER }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

name: Server CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/legalease_ci
      TEST_MONGODB_DB_NAME: legalease_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wait for MongoDB service
        run: |
          for attempt in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/27017) 2>/dev/null && exit 0
            sleep 1
          done
          echo "MongoDB service did not become ready." >&2
          exit 1
      - name: Syntax gate (no lint script configured yet)
        run: find src tests scripts -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test suite including guarded database integrations
        run: npm test -- --experimental-test-coverage
      - name: Dependency audit
        run: npm audit --audit-level=high

name: Sync Prod Env → Vercel

# GitHub Secrets set via `env:` on the vercel deploy job never reach Vercel's
# remote build/runtime — Vercel only reads its own project env vars. This
# workflow pushes the runtime secrets into the Vercel production environment
# via the Vercel REST API, then redeploys so the new values take effect.
# Secret values are never printed: GitHub masks them and the script only
# reports set/skip status.

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/env-sync.yml'
  workflow_dispatch:

jobs:
  sync:
    name: Sync EMAIL_*/VONAGE_*/SENTRY to Vercel prod env
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync environment into Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
          # Secrets must be statically mapped into env — dynamic lookup is not
          # supported by GitHub Actions. Values are auto-masked in logs.
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SSCOMMERZ_STORE_ID: ${{ secrets.SSCOMMERZ_STORE_ID }}
          SSCOMMERZ_STORE_PASSWORD: ${{ secrets.SSCOMMERZ_STORE_PASSWORD }}
          SSCOMMERZ_SANDBOX: ${{ secrets.SSCOMMERZ_SANDBOX }}
          VONAGE_API_KEY: ${{ secrets.VONAGE_API_KEY }}
          VONAGE_API_SECRET: ${{ secrets.VONAGE_API_SECRET }}
          VONAGE_FROM_NUMBER: ${{ secrets.VONAGE_FROM_NUMBER }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ENV_SPEC: >-
            EMAIL_HOST,
            EMAIL_PORT,
            EMAIL_USER,
            EMAIL_PASS,
            EMAIL_FROM,
            SSCOMMERZ_STORE_ID,
            SSCOMMERZ_STORE_PASSWORD,
            SSCOMMERZ_SANDBOX,
            VONAGE_API_KEY,
            VONAGE_API_SECRET,
            VONAGE_FROM_NUMBER,
            SENTRY_DSN
        run: |
          cat > /tmp/vercel-env-sync.mjs <<'EOF'
          const token = process.env.VERCEL_TOKEN
          const teamId = process.env.VERCEL_ORG_ID
          const projectId = process.env.VERCEL_PROJECT_ID
          if (!token || !teamId || !projectId) {
            console.error('Missing VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_BACKEND_PROJECT_ID')
            process.exit(1)
          }
          const names = process.env.ENV_SPEC.split(',').map(s => s.trim()).filter(Boolean)
          const api = (path, opts = {}) =>
            fetch(`https://api.vercel.com${path}${path.includes('?') ? '&' : '?'}teamId=${teamId}`, {
              ...opts,
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...(opts.headers || {}) }
            }).then(async r => ({ status: r.status, body: await r.text() }))

          let setCount = 0
          for (const name of names) {
            const value = process.env[name]
            if (!value) { console.log(`SKIP ${name} (not set in GitHub Secrets)`); continue }
            // Upsert: delete existing env var (all targets) then create for production
            const del = await api(`/v9/projects/${projectId}/env?upsert=true&target=production`, {
              method: 'POST',
              body: JSON.stringify({ key: name, value, type: 'encrypted', target: ['production'] })
            })
            if (del.status === 201 || del.status === 200) { console.log(`SET ${name} (production)`); setCount++ }
            else console.log(`WARN ${name} -> HTTP ${del.status}: ${del.body.slice(0, 200)}`)
          }
          console.log(`Synced ${setCount}/${names.length} variables`)
          EOF
          node /tmp/vercel-env-sync.mjs

      - name: Redeploy production with new env
        run: npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
